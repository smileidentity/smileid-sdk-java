name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish to Maven Central
    if: github.repository == 'smileidentity/smileid-sdk-java'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release for the tag
      pull-requests: read # find breaking pull requests since the last release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The breaking-change check needs the previous release tag.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Gradle itself runs on the last JDK listed; 11 is the build toolchain.
          java-version: |
            11
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check the tag matches the version in build.gradle.kts
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          build_version="$(./gradlew -q properties --property version | awk '/^version: / { print $2 }')"
          if [ "$tag_version" != "$build_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} would publish version ${build_version} from build.gradle.kts. Fix the version or the tag, then try again."
            exit 1
          fi

      - name: Check CHANGELOG.md has an entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' heading. Add a changelog entry for this version before tagging a release."
            exit 1
          fi

      - name: Check the version bump matches the breaking pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The previous stable tag that is an ancestor of this one, so a
          # backport tag on an older line sees only its own commits.
          previous_tag="$(scripts/release-tags.sh last-stable "${GITHUB_SHA}^")"
          if [ -z "$previous_tag" ]; then
            echo "::notice::No earlier vX.Y.Z tag, so there is no version bump to check."
            exit 0
          fi
          # Breaking pull requests whose merge commit is in previous_tag..this tag.
          breaking="$(scripts/release-tags.sh breaking-prs "$previous_tag" "$GITHUB_SHA")"
          count=0
          if [ -n "$breaking" ]; then
            echo "Pull requests labelled breaking since ${previous_tag}:"
            echo "$breaking"
            count="$(printf '%s\n' "$breaking" | wc -l | tr -d ' ')"
          fi
          if ! scripts/release-tags.sh check-bump "$previous_tag" "$GITHUB_REF_NAME" "$count"; then
            echo "::error::${GITHUB_REF_NAME} does not match the breaking pull requests merged since ${previous_tag}. See the message above."
            exit 1
          fi

      - name: Check the tag points at a commit on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main. Publishing to Maven Central cannot be undone, so tag a merged commit instead."
              exit 1
              ;;
          esac

      - name: Check the publishing secrets are set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          missing=""
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_IN_MEMORY_KEY SIGNING_IN_MEMORY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}. Add them before tagging a release."
            exit 1
          fi

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build test

      - name: Example app tests
        run: ./gradlew -p example build

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
