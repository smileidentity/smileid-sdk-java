name: Test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The JVM the tests run on. Compilation always targets Java 11.
        test-java-version: [11, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # Gradle itself runs on the last JDK listed; 11 is the build toolchain.
          java-version: |
            11
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Build and test
        run: ./gradlew build test -PtestJavaVersion=${{ matrix.test-java-version }}
      - name: Example app tests
        run: ./gradlew -p example build
