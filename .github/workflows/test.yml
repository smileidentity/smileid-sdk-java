name: Test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# A new push to a pull request cancels its older run. Pushes to main and merge
# queue runs each get their own group (by commit), so quick merges don't
# cancel or replace each other's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The JVM the tests run on. Compilation always targets Java 11.
        test-java-version: [11, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # Gradle itself runs on the last JDK listed; 11 is the build toolchain.
          java-version: |
            11
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Build and test
        run: ./gradlew build test -PtestJavaVersion=${{ matrix.test-java-version }}
      - name: Example app tests
        run: ./gradlew -p example build

  # Checks spec-coverage.json against the whole spec at its spec_tag.
  # SpecCoverageTest checks it against the code.
  spec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: smileidentity/central-workflows/.github/actions/spec-coverage@703bbffeb087fee44fc38a047e19951440863c9e # main
