name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish to Maven Central
    if: github.repository == 'smileidentity/smileid-sdk-java'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release for the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check the tag matches the version in build.gradle.kts
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          build_version="$(./gradlew -q properties --property version | awk '/^version:/ { print $2 }')"
          if [ "$tag_version" != "$build_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} would publish version ${build_version} from build.gradle.kts. Fix the version or the tag, then try again."
            exit 1
          fi

      - name: Check the publishing secrets are set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          missing=""
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_IN_MEMORY_KEY SIGNING_IN_MEMORY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}. Add them before tagging a release."
            exit 1
          fi

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build test

      - name: Example app tests
        run: ./gradlew -p example build

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
