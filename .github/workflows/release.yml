name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish to Maven Central
    if: github.repository == 'smileidentity/smileid-sdk-java'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release for the tag
      pull-requests: read # find breaking pull requests since the last release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The breaking-change check needs the previous release tag.
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # Gradle itself runs on the last JDK listed; 11 is the build toolchain.
          java-version: |
            11
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check the version, changelog and breaking pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The same checks run on release pull requests (quality-gates.yml), so
        # they should already pass here.
        run: scripts/check-release.sh "$GITHUB_REF_NAME"

      - name: Check the tag points at a commit on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main. Publishing to Maven Central cannot be undone, so tag a merged commit instead."
              exit 1
              ;;
          esac

      - name: Check the publishing secrets are set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          missing=""
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_IN_MEMORY_KEY SIGNING_IN_MEMORY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}. Add them before tagging a release."
            exit 1
          fi

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build test

      - name: Example app tests
        run: ./gradlew -p example build

      - name: Check whether this version is already on Maven Central
        id: central
        run: |
          # Central rejects a version it already has, so a re-run of this
          # workflow (for example, after the GitHub release step failed) must
          # skip publishing. The pom appears before maven-metadata.xml is
          # updated, so check both.
          version="${GITHUB_REF_NAME#v}"
          base="https://repo1.maven.org/maven2/com/smileidentity/usesmileid-java"
          pom_status="$(curl -sS -o /dev/null -w '%{http_code}' "${base}/${version}/usesmileid-java-${version}.pom" || true)"
          metadata="$(curl -sSfL "${base}/maven-metadata.xml" || true)"
          if [ "$pom_status" = 200 ] || grep -qF "<version>${version}</version>" <<<"$metadata"; then
            echo "::notice::${version} is already on Maven Central, so it will not be published again."
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$pom_status" = 404 ]; then
            echo "${version} is not on Maven Central yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not tell whether ${version} is on Maven Central (HTTP ${pom_status} for its pom). Try again later."
            exit 1
          fi

      - name: Publish to Maven Central
        if: steps.central.outputs.published == 'false'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
